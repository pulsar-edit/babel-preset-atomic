name: CI

on:
  pull_request:
  push:
    branches: ['master']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install Dependencies
        run: npm install
        continue-on-error: true # Due to some TypeScript shenanigans we technically fail during install
      - name: Test
        run: npm run test
